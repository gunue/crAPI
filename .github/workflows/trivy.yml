name: Trivy Vulnerability Scan

on:
  workflow_dispatch:  # Manual trigger only to avoid triggering other workflows
  schedule:
    - cron: '0 2 * * 0'  # Optional weekly scan (every Sunday)

permissions:
  contents: read
  security-events: write  # To upload SARIF to GitHub Security tab

env:
